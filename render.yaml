services:
  - type: web
    name: csms-backend
    env: node
    plan: free
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: "mongodb+srv://authentication:[EMAIL_ADDRESS]/csms_db"
      - key: JWT_SECRET
        value: "csms_jwt_secret_key_2026_change_in_production"
